# Moonlit island — volcanic landmass in an infinite ocean on a 4 km terrain footprint.
# Madeira-like twin massifs (north & south) with a central rift valley and lagoons.
# Hybrid LOD: 3 m coarse global bake + full analytic height within ~40 m of camera.
#
# Run with:
#   go run . -scene scenes/island.toml
# go run ./cmd/preview -scene scenes/preview/island.toml -o tmp/island

# ---------------------------------------------------------------- camera ----
# Approach from the southern lagoon toward the villa on the central ridge.

[camera]
pos = [0.0, 2.2, 144.0]
yaw = 0.0
pitch = 0.02

[environment]
sky = "night_stars"
ambient_sky = [0.060, 0.075, 0.100]
ambient_ground = [0.018, 0.020, 0.026]
sun_dir = [1, -1.2, 0.90]
sun_color = [0.16, 0.19, 0.27]

[environment.sun]
color = [0.4, 0.45, 1.5]
size  = 5.0
glow  = 0.1

[[light]]
pos = [-222.0, 266.0, -200.0]
color = [1.4, 1.6, 2.4]
brightness = 120.0
range = 0

# --------------------------------------------------------------- terrain ----
# 4000×4000 m height field with a 3 m coarse bake (hybrid LOD: analytic near band).
# Island falloff: ~520 m land diameter, ~780 m shore shelf to the seabed.

[[terrain]]
origin = [-2000.0, 0.0, -2000.0]
size = [4000.0, 4000.0]
coarse_cell = 1.5
hybrid_near = [40.0, 50.0]
base = 1.2
detail = 0.26
detail_scale = 0.12
step = 0.2
grass = "grass"
rock = "stone"
snow = "snow"
slope_lo = 0.30
slope_hi = 0.62
snow_lo = 32.0
snow_hi = 42.0

  [terrain.island]
  center = [0.0, 0.0]
  radius = 260.0
  margin = 130.0
