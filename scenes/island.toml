  half = [8.5, 8.0]
  level = 3.0
  margin = 5.0

# ----------------------------------------------------------------- ocean ----

[[water]]
pos = [0.0, 0.0]
radius = 0
level = 0.0
mask = true
ripple = 0.04
ripple_animation_speed = 0.5
ripple_direction = [1.0, 0.35]
material = "mirror"
albedo = [0.50, 0.66, 0.82]

# ================================================================ THE VILLA ====

[[include]]
file = "objects/art-nouveau-villa.toml"
at = [18.0, 0.0, -32.0]
transform_origin = [0.0, 0.0, 0.0]

