# Moonlit island — volcanic landmass in an infinite ocean on a 2 km terrain footprint.
# Hybrid LOD: 3 m coarse global bake + full analytic height within ~40 m of camera.
#
# Run with:
#   go run . -scene scenes/island.toml
#   go run ./cmd/preview -scene scenes/preview/island.toml -o /tmp/island

# ---------------------------------------------------------------- camera ----
# Approach from the southern lagoon toward the villa on the central ridge.

[camera]
pos = [0.0, 2.2, 72.0]
yaw = 0.0
pitch = 0.02

[environment]
sky = "night_stars"
ambient_sky = [0.060, 0.075, 0.100]
ambient_ground = [0.018, 0.020, 0.026]
sun_dir = [1, -1.2, 0.90]
sun_color = [0.16, 0.19, 0.27]

[environment.sun]
color = [0.4, 0.45, 1.5]
size  = 5.0
glow  = 0.1

[[light]]
pos = [-111.0, 133.0, -100.0]
color = [1.4, 1.6, 2.4]
brightness = 30.0
range = 0

# --------------------------------------------------------------- terrain ----
# 2000×2000 m height field with a 3 m coarse bake (hybrid LOD: analytic near band).
# Island falloff: ~260 m land diameter, ~390 m shore shelf to the seabed.

[[terrain]]
origin = [-1000.0, 0.0, -1000.0]
size = [2000.0, 2000.0]
coarse_cell = 3.0
hybrid_near = [40.0, 60.0]
base = 1.2
detail = 0.26
detail_scale = 0.12
step = 0.28
grass = "grass"
rock = "stone"
snow = "snow"
slope_lo = 0.30
slope_hi = 0.62
snow_lo = 20.0
snow_hi = 27.0

  [terrain.island]
  center = [0.0, 0.0]
  radius = 130.0
  margin = 65.0
  floor = -16.0

  # ---- main volcanic complex (center-north) ----
  [[terrain.feature]]
  kind = "peak"
  pos = [0.0, -28.0]
  height = 30.0
  width = 24.0
  steepness = 2.1

  [[terrain.feature]]
  kind = "peak"
  pos = [-14.0, -18.0]
  height = 22.0
  width = 20.0
  steepness = 2.0

  [[terrain.feature]]
  kind = "peak"
  pos = [22.0, -20.0]
  height = 20.0
  width = 18.0
  steepness = 2.1

  [[terrain.feature]]
  kind = "peak"
  pos = [-8.0, -8.0]
  height = 18.0
  width = 16.0
  steepness = 2.2

  # ---- long ridges ----
  [[terrain.feature]]
  kind = "peak"
  pos = [0.0, -62.0]
  height = 16.0
  width = 34.0
  steepness = 1.7
  extend = [2.6, 1.0]

  [[terrain.feature]]
  kind = "peak"
  pos = [-52.0, -18.0]
