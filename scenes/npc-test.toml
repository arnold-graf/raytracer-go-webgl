# Minimal scene for testing procedural NPC locomotion.
# Run: go run . -scene scenes/npc-test.toml

[camera]
pos = [0.0, 1.6, 5.0]
yaw = 180.0
pitch = 0.0

[[plane]]
normal = [0.0, 1.0, 0.0]
d = 0.0
material = "checker"
albedo = [0.75, 0.7, 0.65]
albedo2 = [0.15, 0.15, 0.18]
reflect = 0.15
rough = 0.02

[[plane]]
normal = [0.0, 0.0, 1.0]
d = -8.0
material = "diffuse"
albedo = [0.5, 0.45, 0.75]

[[plane]]
normal = [0.0, -1, 0.0]
d = -5.0
material = "diffuse"
albedo = [0.7, 0.7, 0.72]

# Small stepped platforms along +X for uneven-ground foot placement.
[[box]]
min = [2.0, 0.0, -0.8]
max = [4.0, 0.15, 0.8]
material = "diffuse"
albedo = [0.6, 0.55, 0.5]

[[box]]
min = [4.0, 0.0, -0.8]
max = [6.0, 0.30, 0.8]
material = "diffuse"
albedo = [0.6, 0.55, 0.5]

[[box]]
min = [6.0, 0.0, -0.8]
max = [8.0, 0.15, 0.8]
material = "diffuse"
albedo = [0.6, 0.55, 0.5]

[[box]]
min = [-0.5, 0.0, -0.5]
max = [0.5, 0.18, 0.5]
material = "metal"
albedo = [0.8, 0.8, 0.85]
rough = 0.1

[[light]]
pos = [2.0, 3.5, 1.0]
color = [8.0, 7.0, 5.0]
radius = 0.4

[[light]]
pos = [-2.0, 3.0, -1.0]
color = [3.0, 4.0, 8.0]
radius = 0.3

[[npc]]
rig = "data/rigs/humanoid.yaml"
pose = "idle"
at = [-1.0, 0.0, 0.0]
# heading 270° walks toward +X, across the stepped boxes above.
yaw = 270.0
speed = 1.2
heading = 270.0
