# ============================================================ THE BUILDING ====
# Composite object: see scenes/building.toml (slanted roof + glass window).
# at.y = 0 places the building floor origin on the terrain; the pad below
# flattens the site to y = 0 in the surrounding height field.

[[include]]
at = [16.0, 0.0, -2.0]
file = "objects/building.toml"

[[terrain.pad]] # flat building site under the indoor room
# Covers the room footprint (x in [11.1, 20.9], z in [-7.9, 3.9]) and blends
# the surrounding relief down to 0.0 so nothing pokes through the floor slab
# (top y=0.4). The walls hide the seam at the footprint edge.
center = [16.0, -2.0]
half = [4.9, 5.9]
level = 0.0
margin = 4.0

# The building's interior (spheres, furniture, columns, cones, tori and the two
# Otto-Wagner pendant lamps) now lives inside objects/building.toml so the whole
# room travels with the building include above.

# ---- campfire on the lake shore (three glowing orbs + a flickering light) ----

[[sphere]] # orb 1 (red-orange)
albedo = [3.6, 1.3, 0.35]
center = [0.0, 0.24, 3.18]
material = "emit"
radius = 0.18

[[sphere]] # orb 2 (orange)
albedo = [4.0, 1.9, 0.6]
center = [0.24, 0.22, 2.86]
material = "emit"
radius = 0.16

[[sphere]] # orb 3 (yellow)
albedo = [3.8, 2.6, 0.95]
center = [-0.24, 0.22, 2.9]
material = "emit"
radius = 0.16

# brightness scales intensity independently of color/range (1 = as authored).
[[campfire]] # bright, lively fire under the night sky; culled inside the building
brightness = 0.25
center = [0.0, 0.42, 3.0]
color = [5.5, 2.7, 0.95]
flicker = 0.75
jitter = 0.16
range = 20
speed = 1
