# Experimental combined map: the outdoor terrain world (outdoors.toml) plus the
# textured indoor showcase (textured.toml) enclosed in a walk-in stone building.
# You spawn outside at night under the starfield and can walk in/out through the
# building's door (free-fly movement, so the doorway is a real opening you pass
# through).
#
# The indoor room is rebuilt from finite boxes instead of the infinite planes
# used by textured.toml -- infinite planes would slice through the open outdoor
# world. All indoor furniture is translated by (+16, +0.4, -2): the building
# sits on a flat patch of terrain to the right, raised onto a low stone
# foundation that hides the terrain's fine relief.
#
# Run with:
#   go run . -scene scenes/indoor-outdoor.toml
#   go run ./cmd/preview -scene scenes/indoor-outdoor.toml -o preview_combined.png

# ---------------------------------------------------------------- camera ----
# Spawn outside, on the ground, facing the lit doorway. Walk forward (W) to enter.

[camera]
pitch = 0.02
pos = [16.0, 1.6, 16.0]
yaw = 0.0

# ----------------------------------------------------------- environment ----
# Clear night with a starfield + faint moon glow. Outdoor light is dim; the
# building's interior emitters provide the warm glow spilling out the door.

[environment]
ambient_ground = [0.018, 0.018, 0.025]
ambient_sky = [0.035, 0.050, 0.090]
sky = "night_stars"
sun_color = [0.10, 0.13, 0.20]
sun_dir = [-0.25, -0.82, 0.42]

# =========================================================== OUTDOOR WORLD ====
# (terrain, water, village houses, trees and cave, copied from outdoors.toml)

