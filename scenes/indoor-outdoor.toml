# ============================================================ THE BUILDING ====
# Composite object: see scenes/building.toml (slanted roof + glass window).

[[include]]
file = "building.toml"
at = [16.0, 0.0, -2.0]

[[terrain.pad]]       # flat building site under the indoor room
# Covers the room footprint (x in [11.1, 20.9], z in [-7.9, 3.9]) and blends
# the surrounding relief down to 0.0 so nothing pokes through the floor slab
# (top y=0.4). The walls hide the seam at the footprint edge.
center = [16.0, -2.0]
half = [4.9, 5.9]
level = 0.0
margin = 4.0

