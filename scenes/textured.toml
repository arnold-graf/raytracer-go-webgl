# Texture showcase -- same geometry as the default scene, but with procedural
# textures applied. Run with:  go run . -scene scenes/textured.toml
#
# Textures are world-space and need no UVs. Available: wood, brick, stone,
# cement, marble. The `albedo` of a textured surface acts as a color tint
# (use [1.0, 1.0, 1.0] for the texture's natural colors).

# ---------------------------------------------------------------- spheres ----

[[sphere]] # mirror ball (untextured)
center = [0.0, 0.9, 0.0]
radius = 0.9
material = "mirror"
albedo = [0.95, 0.95, 0.98]

[[sphere]] # glass ball (untextured)
center = [2.2, 0.5, 0.5]
radius = 0.5
material = "glass"
albedo = [0.88, 0.94, 1.0]

[[sphere]] # marble ball
center = [-2.1, 0.45, -0.3]
radius = 0.45
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "marble"

[[sphere]] # gold metal ball (untextured)
center = [-0.9, 0.35, 2.0]
radius = 0.35
material = "metal"
albedo = [1.0, 0.78, 0.2]
rough = 0.06

[[sphere]] # stone ball
center = [1.6, 0.3, -2.0]
radius = 0.3
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "stone"

[[sphere]] # small mirror ball (untextured)
center = [2.0, 0.22, 1.8]
radius = 0.22
material = "mirror"
albedo = [0.9, 0.9, 0.9]
rough = 0.01

[[sphere]] # warm light
center = [1.0, 3.2, -1.0]
radius = 0.35
material = "emit"
albedo = [10.0, 8.0, 5.0]

[[sphere]] # cool light
center = [-1.5, 2.8, 1.5]
radius = 0.25
material = "emit"
albedo = [4.0, 6.0, 10.0]

