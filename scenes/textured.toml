radius = 0.35
material = "emit"
albedo = [10.0, 8.0, 5.0]

[[sphere]] # cool light
center = [-1.5, 2.8, 1.5]
radius = 0.25
material = "emit"
albedo = [4.0, 6.0, 10.0]

