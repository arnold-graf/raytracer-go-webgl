# Default scene -- a 1:1 representation of scene.Default() (the original
# "DOS-geo" scene). Edit this file and run with:  go run . -scene scenes/default.toml
#
# Conventions:
#   - All numbers are floats (write 0.0, not 0): vectors decode into [x, y, z].
#   - material is one of: diffuse, mirror, metal, glass, emit, checker
#   - ior defaults to 1.5 when omitted; rough defaults to 0.0
#   - reflect (0..1) makes a diffuse/checker surface partly mirror-like while
#     keeping its texture/structure; rough blurs that reflection
#   - planes use n.x*x + n.y*y + n.z*z + d = 0; checker planes use albedo2 too

# ---------------------------------------------------------------- spheres ----

[[sphere]]
center = [0.0, 0.9, 0.0]
radius = 0.9
material = "mirror"
albedo = [0.95, 0.95, 0.98]

[[sphere]]
center = [2.2, 0.5, 0.5]
radius = 0.5
material = "glass"
albedo = [0.88, 0.94, 1.0]

