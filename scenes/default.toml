# ----------------------------------------------------------------- planes ----

[[plane]]
normal = [0.0, 1.0, 0.0]
d = 0.0
material = "checker"
albedo = [0.75, 0.7, 0.65]
albedo2 = [0.15, 0.15, 0.18]
# Keep the checker pattern but make the floor partly reflective (a polished
# tiled look). reflect blends a mirror image over the lit tiles; rough blurs it.
reflect = 0.25
rough = 0.02

[[plane]]
normal = [0.0, 0.0, 1.0]
d = -5.5
