radius = 0.35
material = "metal"
albedo = [1.0, 0.78, 0.2]
rough = 0.06

[[sphere]]
center = [1.6, 0.3, -2.0]
radius = 0.3
material = "diffuse"
albedo = [0.1, 0.25, 0.95]

[[sphere]]
