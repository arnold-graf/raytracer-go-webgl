# Moonlit storm version of the outdoor terrain scene.
# Inherits terrain, water, props, cave, and emitter geometry from outdoors.toml.
#
# Run with:
#   go run . -scene scenes/outdoors-night-storm.toml
#   go run ./cmd/preview -scene scenes/outdoors-night-storm.toml -o preview_night_storm.png

extends = "outdoors.toml"

[environment]
sky = "night_storm"
ambient_sky = [0.060, 0.075, 0.100]
ambient_ground = [0.018, 0.020, 0.026]
sun_dir = [0.08, -0.42, 0.90]
sun_color = [0.16, 0.19, 0.27]

# Strong warm campfire against the cold storm light.
[[campfire]]
center = [0.0, 0.5, 3.0]
color = [6.5, 3.2, 1.1]
range = 17.0
flicker = 0.55
