[const]
is_night = true

# if not is_night
# sunset
[environment]
sky = "sunset"
ambient_sky = [0.20, 0.12, 0.10]
sun_dir = [-0.35, -0.22, 0.90]
sun_color = [1.40, 0.55, 0.22]
# Sun in a low position to the left of the server-room (sunset)
[[light]]
pos = [-10.35, 200, 0]
color = [1.4, 0.55, 0.22]
brightness = 20.0
range = 100
# endif

# if is_night
# night storm
[environment]
sky = "night_storm"
ambient_sky = [0.003,0.003,0.005]
sun_dir = [-0.35, -0.22, 0.90]
sun_color = [1.40, 0.55, 0.22]

# Moonlight
[[light]]
pos = [200, 350, 100]
color = [0.5, 0.5, 1]
brightness = 50
range = 300

# Moon
[[sphere]]
material = "diffuse"
texture = "cement"
center = [260, 410, 150]
albedo = [8,8,10]
radius = 30
# endif

[camera]
# Eye height on the server-room floor (y=200.2 + 1.6), facing the cube (-Z).
pos = [10.0, 201.8, 8.0]
yaw = 0.0
pitch = 0.0

[[include]]
file = "server-room-1.toml"
transform_origin = [0, 0, 0]
at = [0, 200, 0]

# building below the server-room
[[box]]
material = "diffuse"
reflect = 0.15
albedo = [0.5, 0.5, 0.5]
width = 50.0
height = 200.0
depth = 20.0
pos_x = 0.0
pos_y = 0.0
pos_z = 0.0

# building above the server-room
[[box]]
material = "diffuse"
reflect = 0.4
albedo = [0.5, 0.5, 0.5]
width = 50.0
height = 25
depth = 20.0
pos_x = 0.0
pos_y = 208.1
pos_z = 0.0

[[include]]
file = "server-room-front-office.toml"
transform_origin = [0, 0, 0]
at = [40, 200, 0]

# Skyway from the front-office south door (local 1,0,20) → world 41,200,20.
[[include]]
file = "objects/skyway.toml"
transform_origin = [0, 0, 0]
at = [41.0, 200.0, 20.0]
props = { length = 30 }

# building below the main office building
[[box]]
material = "diffuse"
reflect = 0.25
albedo = [0.5, 0.5, 0.5]
width = 100
height = 200.0
depth = 100
pos_x = 20.0
pos_y = 0
pos_z = 50.0

[[include]]
file = "office-atrium.toml"
at = [20, 200, 50]
transform_origin = [0,0,0]
props = {width = 100, show_sun = '!is_night'}

[[include]]
file = "objects/skyscrapers-distance.toml"
transform_origin = [0, 0, 0]
at = [0, 0, 0]

[[include]]
file = "objects/skyscrapers-distance.toml"
transform_origin = [0, 0, 0]
at = [300, 0, 0]
