depth = 0.11

[[include]]
file = "workstation-monitor.toml"
at = [0.0, 0.3, 0.0]
rotate_x = -8
props = {
  screen_id = 'screen_id',
  material = 'material',
  albedo = 'albedo',
  reflect = 'reflect',
  rough = 'rough',
  hint = 'hint',
  use_range = 'use_range',
  headline = 'headline',
  paragraphs = 'paragraphs',
  font = 'font',
  font_size_px = 'font_size_px',
  font_color = 'font_color',
}

