[[box]]
material = "diffuse"
pos_x = 0
pos_y = 0
pos_z = 0
width = 0.9
height = 0.5
depth = 1
albedo = [0.05, 0.05, 0.05]

# front blinking light
[[sphere]]
material = "emit"
center = [0.1, 0.2, 1]
radius = 0.02
albedo = [1, 1, 1]
brightness = 10
color = [1, 1, 1]
range = 10

# front light
[[light]]
pos = [0.1, 0.2, 1.1]
color = [1, 1, 1]
range = 0.2
brightness = 0.2

# back light
[[light]]
pos = [0.1, 0.2, -0.05]
color = [2, 0, 1]
range = 0.8
brightness = 0.5

# back blinking light
[[sphere]]
material = "emit"
center = [0.1, 0.2, 0]
radius = 0.02
albedo = [2, 0, 1]
brightness = 10
color = [1, 1, 1]
range = 10
