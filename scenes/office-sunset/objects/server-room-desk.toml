# table (desk) to the left of the cube
[[include]]
file = "../../objects/simple-table.toml"
at = [0, 0, 0]
rotate_y = 20
params = { width = 2, height = 0.9, texture = "wood" }

# Laptop on the desk
[[include]]
file = "laptop.toml"
at = [0, 0.9, 0.3]
rotate_y = 15

# Chair at the desk (faces the laptop)
[[include]]
file = "../../objects/simple-chair.toml"
at = [0.5, 0, 2]
rotate_y = -7

# glass bottle on the desk
[[include]]
instance = true
file = "../../objects/glass-bottle.toml"
at = [-0.3, 0.9, 0.5]

# ashtray on the desk
[[include]]
instance = true
file = "../../objects/ashtray.toml"
at = [0.5, 0.9, 0.3]
