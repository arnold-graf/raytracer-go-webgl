# screen
[[screen]]
id = "laptop_display"
material = "diffuse"
albedo = [0.01, 0.01, 0.1]
reflect = 0.1
rough = 0.1
rotate_x = -10
pos_x = 0.06
pos_y = 0.12
pos_z = -0.02
width = 0.28
height = 0.23
depth = 0.001
hint = "WORKSTATION"
headline = "Session Report"
paragraphs = [
  "1 hr 2 min, 15 seconds",
  "----------- KPIS -----------",
  "Avg Dopamine ... 0.521 µg/ml",
  "Avg Cortisol ... 0.99 µg/ml",
  "Med Adrenaline ... 0.21 µg/ml",
  "Med Serotonin ...  0.75 µg/ml",
  "GABA level ... 0.99 µg/ml",
  "---------- Debug ---------",
  "Errors ... 7",
  "Warnings ... 3",
  "Critical ... 0",
]
font = "M42.ttf"
font_size_px = 14
font_color = [1, 1, 1]

