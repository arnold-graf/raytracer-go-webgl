# The Cube is a 5x5x0.5 room. Origin is the footprint center. Interior walls
# display the five captured views (forward, left, right, up, down).
#
# Exit portal arrival uses [[point]] id "cube_lab_1" (see internal/app/portal.go).
# floor_y is the walkable surface; pos is x/z in the room. Do not SnapToGround on
# arrival — Manhattan's center tower roof sits above this point.

[[point]]
id = "cube_lab_1"
pos = [1.5, 0.0, 1.5]
floor_y = 0.3
yaw = 0.0
pitch = 0.0

# Front wall (interior face +Z at z = -0.5)
[[box]]
material = "diffuse"
pos_x = -1
pos_y = -1
pos_z = -1
width = 5
height = 5
depth = 0.5
albedo = [1, 1, 1]
texture = "capture_forward"

# Light
[[campfire]]
center = [2.5, 2.5, 1]
color = [0.1, 0.1, 0.2]
brightness = 1.8
range = 50
flicker = 0.5
speed = 0.5
seed = 0

# Left wall (interior face +X at x = -0.5)
[[box]]
material = "diffuse"
pos_x = -1
pos_y = -1
pos_z = -1
width = 0.5
height = 5
depth = 5
albedo = [1, 1, 1]
texture = "capture_left"

# Left wall metal cover
[[box]]
material = "diffuse"
reflect = 0.2
pos_x = -1.1
pos_y = -1
pos_z = -1
width = 0.1
height = 5.5
depth = 5
rough = 0.01
albedo = [0.5, 0.5, 0.5]

# Right wall (interior face -X at x = 3.5)
[[box]]
material = "diffuse"
pos_x = 4
pos_y = -1
pos_z = -1
width = 0.5
height = 5.5
depth = 5
albedo = [1, 1, 1]
texture = "capture_right"

# Right wall metal cover
[[box]]
material = "diffuse"
reflect = 0.6
pos_x = 4.5
pos_y = -1
pos_z = -1
width = 0.1
height = 5.5
depth = 5
rough = 0.01
albedo = [0.5, 0.5, 0.5]

# Roof (interior face -Y at y = 3.5)
[[box]]
material = "diffuse"
pos_x = -1
pos_y = 4
pos_z = -1
width = 5.5
height = 0.5
depth = 5
albedo = [1, 1, 1]
texture = "capture_up"

# Roof metal cover
[[box]]
material = "diffuse"
reflect = 0.6
pos_x = -1.1
pos_y = 4.5
pos_z = -1
width = 5.7
height = 0.1
depth = 5
rough = 0.01
albedo = [0.5, 0.5, 0.5]

# Pipes from the cube to the ceiling
[[cylinder]]
material = "diffuse"
reflect = 0.2
rough = 0.01
albedo = [1, 0, 0]
pos_x = 1.4
pos_y = 5
pos_z = 3
width = 0.2
height = 2

[[cylinder]]
material = "diffuse"
reflect = 0.2
rough = 0.01
albedo = [0, 1, 0]
pos_x = 0.7
pos_y = 5
pos_z = 3
width = 0.2
height = 2

[[cylinder]]
material = "diffuse"
reflect = 0.2
rough = 0.01
albedo = [1, 1, 0]
pos_x = 2
pos_y = 5
pos_z = 3
width = 0.2
height = 2

# Floor (interior face +Y at y = 0.25)
[[box]]
reflect = 0.1
material = "diffuse"
pos_x = -1
pos_y = 0
pos_z = -1
width = 5
height = 0.25
depth = 5
albedo = [0.25, 0.25, 0.25]
texture = "capture_down"
