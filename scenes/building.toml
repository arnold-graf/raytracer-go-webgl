# Stone building shell in local coordinates (origin = building center, y = floor).
# Place in a parent scene with [[include]] at = [16.0, 0.0, -2.0].
# Interior clear span: x in [-4.5, 4.5], z in [-5.5, 5.5], floor y = 0.4.

[[box]] # foundation / stone floor slab
min = [-4.9, -0.3, -5.9]
max = [4.9, 0.4, 5.9]
material = "diffuse"
# albedo = [1.0, 1.0, 1.0]
# texture = "marble"
# reflect = 0.05
# rough = 0.01
# for a wood texture
albedo = [0.25, 0.25, 0.25]
texture = "wood"
reflect = 0.01
rough = 0.01

[[box]] # slanted roof (cement); pitched toward the door (+z)
min = [-4.7, 5.8, -5.7]
max = [4.7, 6.1, 5.7]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "cement"
rotate_x = -12.0
pivot = [0.0, 5.9, 0.0]

[[box]] # north (back) wall: brick
min = [-4.9, 0.0, -5.9]
max = [4.9, 6.3, -5.5]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "brick"

[[box]] # west (left) wall: brick, with a window opening cut through it
min = [-4.9, 0.0, -5.9]
max = [-4.5, 6.3, 5.9]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "brick"
# Real see-through opening (CSG hole). X overshoots the wall thickness so it
# pierces both faces cleanly; the glass pane below fills it.
[[box.hole]]
min = [-5.0, 1.5, -1.0]
max = [-4.4, 3.5, 1.0]

[[box]] # east (right) wall: brick
min = [4.5, 0.0, -5.9]
max = [4.9, 6.3, 5.9]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "brick"

[[box]] # south wall, left of door: brick
min = [-4.9, 0.0, 5.5]
max = [-1.5, 6.3, 5.9]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "brick"

[[box]] # south wall, right of door: brick
min = [1.5, 0.0, 5.5]
max = [4.9, 6.3, 5.9]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "brick"

[[box]] # door lintel (brick) above the opening
min = [-1.5, 3.0, 5.5]
max = [1.5, 6.3, 5.9]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "brick"

# Tinted, rough glass pane filling the window opening (spans the wall thickness
# so it reads as glass from inside and outside).
[[box]]
min = [-4.9, 1.5, -1.0]
max = [-4.5, 3.5, 1.0]
material = "glass"
albedo = [0.82, 0.90, 0.98]
transmit = 0.85
rough = 0.02
ior = 1.45

# Interior wallpaper lining (Art-Nouveau). Thin panels just inside the brick.

[[box]] # north wall lining
min = [-4.5, 0.4, -5.50]
max = [4.5, 5.9, -5.42]
material = "diffuse"
albedo = [1.0, 1.0, 1.0]
texture = "wallpaper_navy"

[[box]] # west wall lining (split around the window)
