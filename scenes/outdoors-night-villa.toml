# ----------------------------------------------------------------- campfire ----
# A campfire on the lake shore (replaces the old lantern orb). The visible part
# is just three glowing orbs (which also reflect in the water); the light is a
# [[campfire]] -- a cluster of warm point lights that flicker in intensity and
# position over time, so the surrounding shadows dance.

[[sphere]] # orb 1 (red-orange)
center = [-6.0, 0.24, 5]
radius = 0.18
material = "emit"
albedo = [3.6, 1.3, 0.35]

[[sphere]] # orb 2 (orange)
center = [-6.0, 0.22, 4.86]
radius = 0.16
material = "emit"
albedo = [4.0, 1.9, 0.6]

[[sphere]] # orb 3 (yellow)
center = [-6.0, 0.22, 4.9]
radius = 0.16
material = "emit"
albedo = [3.8, 2.6, 0.95]

# The flickering light cluster. center sits just above the orbs.
# color sets the warm hue; brightness scales the overall intensity (so you can
# tune how bright the fire glows without touching its color or its reach).
#   brightness - overall intensity multiplier on color (1 = as authored)
#   range      - how far the firelight reaches (cull/falloff distance)
#   jitter     - position wobble radius (world units)
#   flicker    - intensity wobble amount in [0,1]
#   speed      - flicker speed multiplier
#   seed       - phase offset (use different values for multiple fires)
[[campfire]]
center = [-6.0, 3, 5.0]
color = [3.6, 1.7, 0.55]
brightness = 1.0
range = 25.0
jitter = 0.4
flicker = 0.45
speed = 1.0


[[include]]
file = "objects/exit-button.toml"
at = [70.0, 0.0, 50.0]
rotate_y = -90
