# Stormy outdoor world with the Art-Nouveau villa on a flat pad.
# Inherits terrain, water, props, cave, and lake campfire from outdoors-night-storm.toml.
#
# Run with:
#   go run . -scene scenes/outdoors-night-storm-villa.toml
#   go run ./cmd/preview -scene scenes/outdoors-night-storm-villa.toml -o preview_villa_storm.png

# ---------------------------------------------------------------- camera ----
# Approach from the valley, facing the villa facade (+Z). Warm firelight from
# the hearth and lake campfire contrasts with the cold storm sky.

[camera]
pos = [0.0, 2.0, 14.0]
yaw = 0.0
pitch = 0.04

[environment]
sky = "night_stars"
# ambient_sky = [0.060, 0.075, 0.100]
ambient_ground = [0.018, 0.020, 0.026]
sun_dir = [1, -1.2, 0.90]
sun_color = [0.16, 0.19, 0.27]

# [environment.sun]
# color = [0.4, 0.45, 1.5]     # disc radiance (>1 reads as bright/HDR)
# size  = 5.0                  # angular diameter in degrees
# glow  = 0.1                  # halo strength (omit/0 -> 1.0)

# moon
[[sphere]]
center = [-500.0, 2000, -500]
radius = 200.0
material = "diffuse"
texture = "cement"
albedo = [30.0, 30.0, 35.0]

# Moonlight as a distant point light (shadows only come from [[light]]/campfire;
# sun_dir and [environment.sun] are sky-only). Placed along -sun_dir so shadow
# rays match the visible moon. range = 0 keeps it global across the valley.
[[light]]
pos = [-111.0, 133.0, -100.0]
color = [1.4, 1.6, 2.4]
brightness = 30.0
range = 0

[player.movement]
gravity = 0.1
double_jump_enabled = true

# --------------------------------------------------------------- terrain ----
# A single height field. Peaks have positive height, valleys negative (or use
# kind="valley"). grass/rock/snow are blended by slope (slope_lo..slope_hi) and
# altitude (snow_lo..snow_hi).

[[terrain]]
origin = [-40.0, 0.0, -40.0]
size = [400, 400]
# No coarse_cell / hybrid_near here — at 400×400 m the legacy ~0.25 m full bake is
# faster than hybrid LOD (the whole scene sits inside the analytic near band).
base = 0.0
detail = 0.35           # fine fBm relief
detail_scale = 0.12
step = 0.28             # marching step
grass = "grass"
rock = "stone"
snow = "snow"
slope_lo = 0.32
slope_hi = 0.68
snow_lo = 7.5
snow_hi = 10.5

  [[terrain.feature]]   # snowy mountain (back-left)
  kind = "peak"
  pos = [-16.0, -24.0]
  height = 20.0
  width = 15.0
  steepness = 2.0

  [[terrain.feature]]   # mountain (back-right)
  kind = "peak"
  pos = [15.0, -26.0]
  height = 10.0
  width = 11.0
  steepness = 2.0

  [[terrain.feature]]   # long ridge across the back
  kind = "peak"
  pos = [0.0, -33.0]
  height = 9.0
  width = 24.0
  steepness = 2.0
  extend = [3.0, 1.0]

  [[terrain.feature]]   # gentle foreground hill (left)
  kind = "peak"
  pos = [-24.0, -8.0]
  height = 3.5
  width = 13.0
  steepness = 2.0

  [[terrain.feature]]   
  kind = "peak"
  pos = [-18.0, -2.0]
  height = 4
  width = 3
  steepness = 2.0

  [[terrain.feature]]   # valley basin holding the pond (front-center)
  kind = "valley"
  pos = [0.0, 8.0]
  height = 4.0
  width = 6.0
  steepness = 3.0

  # Villa building pads (absolute grade — the valley floor is ~3 m).
  [[terrain.pad]]
  center = [0.0, -8.0]
  half = [8.5, 8.0]
  level = 3.0
  absolute = true
  margin = 5.0

  [[terrain.pad]]
  center = [48.586, -8.586]
  half = [8.5, 8.0]
  level = 3.0
  absolute = true
  margin = 5.0
  angle = -0.78539816339 # -45°

# ================================================================ MOUNTAINS AT THE OTHER END OF THE VALLEY ====

[[include]]
file = "objects/mountains.toml"
# migrated-center-at
at = [59.187, 1.75, 170.601]

# ================================================================ THE VILLA ====

[[include]]
file = "objects/art-nouveau-villa.toml"
at = [0.0, 0.0, -8.0]
transform_origin = [0.0, 0.0, 0.0]

[[include]]
file = "objects/art-nouveau-villa.toml"
at = [48.586, 0.0, -8.586]
rotate_y = -45.0
transform_origin = [0.0, 0.0, 0.0]


# ----------------------------------------------------------------- water ----
# Reflective pool sitting in the valley basin; reflects terrain, sky and light.

[[water]]
pos = [0.0, 8.0]
radius = 7
level = 1
ripple = 0.05
ripple_animation_speed = 0.6     # drift the waves over time (wind)
ripple_direction = [1.0, 0.4]    # wind drift direction in x,z (optional)
material = "glass"
transmit = 0.5
albedo = [0.35, 0.40, 0.55]

# ------------------------------------------------------------------ trees ----
# Tall pines on the slope; each tree include in the cluster snaps to ground.

[[include]]
file = "objects/pine-tree-cluster.toml"
# migrated-center-at
at = [-1.331, 6.7, -9.336]
instance = true

# The flickering light cluster. center sits just above the orbs.
# color sets the warm hue; brightness scales the overall intensity (so you can
# tune how bright the fire glows without touching its color or its reach).
#   brightness - overall intensity multiplier on color (1 = as authored)
#   range      - how far the firelight reaches (cull/falloff distance)
#   jitter     - position wobble radius (world units)
#   flicker    - intensity wobble amount in [0,1]
#   speed      - flicker speed multiplier
#   seed       - phase offset (use different values for multiple fires)


[[include]]
file = "objects/campfire.toml"
at = [-9.0, 0, 5.0]
props = {
  brightness = 1.0,
  range = 25.0,
  flicker = 0.45,
  speed = 1.0,
  flame_ember = [3.0, 0.2, 0.0],
  flame_mid = [3.5, 1.6, 0.05],
  flame_tip = [2.0, 1.4, 0.2],
}


