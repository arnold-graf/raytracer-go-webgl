# ------------------------------------------------------------------ trees ----
# Tall pines from pine-tree.toml (~15 m). Set follow_terrain on each tree
# [[include]] so every placement snaps to the slope at its own (x, z). The
# cluster file itself does not follow — it is only a layout.

[[include]]
file = "pine-tree.toml"
at = [-18.0, -1.0, -6.0]
rotate_y = 14.0
follow_terrain = true

