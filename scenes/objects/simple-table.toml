# Simple rectangular table in local coordinates.
#
# Origin (0,0,0) is the centre of the footprint on the floor. The top surface
# sits at y = height; four tapered legs sit inset from each corner.
#
# Parameterized via [[include]] props (all optional):
#   width      table size in X                      (default 1.6)
#   depth      table size in Z                      (default: same as width)
#   height     top-surface height above the floor   (default 0.75)
#   top        tabletop thickness                 (default 0.06)
#   leg_radius leg thickness at the floor         (default 0.05)
#   inset      leg inset from the outer edge      (default 0.1)
#   texture, albedo, reflect, rough — surface overrides
#
#   [[include]]
#   file = "objects/simple-table.toml"
#   at = [0.0, 0.0, 0.0]
#   props = { width = 1.6, depth = 0.8, height = 0.75, texture = "wood" }

[props]
width = 1.6
depth = 'width'
height = 0.9
top = 0.06
leg_radius = 0.05
inset = 0.1
texture = "wood"
albedo = [0.55, 0.42, 0.28]
reflect = 0.01
rough = 0.02

[const]
half = 'width / 2'
half_d = 'depth / 2'
off = 'half - inset'
off_z = 'half_d - inset'
leg_h = 'height - top'
leg_d = 'leg_radius * 2'

[[box]] # tabletop
pos_x = '-half'
pos_y = 'leg_h'
pos_z = '-half_d'
width = 'width'
height = 'top'
depth = 'depth'
material = "diffuse"
albedo = 'albedo'
texture = 'texture'
reflect = 'reflect'
rough = 'rough'
specular = 0.2
shininess = 10

# for i in range(4)
[[cylinder]] # leg
pos_x = 'leg_x(i, off, leg_radius)'
pos_y = 0.0
pos_z = 'leg_z(i, off_z, leg_radius)'
width = 'leg_d'
height = 'leg_h'
material = "diffuse"
albedo = 'albedo'
texture = 'texture'
reflect = 'reflect'
rough = 'rough'
# endfor
