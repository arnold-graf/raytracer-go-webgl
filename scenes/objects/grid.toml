# Vertical grid panel (lattice wall) in local coordinates.
#
# Origin (0,0,0) is the bottom-left-front corner. The panel stands in the
# +X/+Y plane; depth runs in +Z. Vertical beams are unit_size wide; horizontal
# beams are unit_size tall; gaps between beams are also unit_size (square holes).
#
# Parameterized via [[include]] props (all optional):
#   width      panel width in X                  (default 4.0)
#   height     panel height in Y                 (default 4.0)
#   depth      panel thickness in Z              (default 0.1)
#   unit_size  beam width/height and gap size    (default 0.5)
#   albedo     RGB colour                        (default [0.5, 0.5, 0.5])
#   material   surface type                      (default "diffuse")
#   reflect    specular reflectance              (default 0.05)
#
# Example — metal server-room grille:
#
#   [[include]]
#   file = "objects/grid.toml"
#   at = [0.0, 0.0, 0.0]
#   props = { width = 8.0, height = 6.0, depth = 0.15, unit_size = 0.4,
#              albedo = [0.35, 0.35, 0.38], material = "metal", reflect = 0.45 }

[props]
width = 4.0
height = 4.0
depth = 0.1
unit_size = 0.5
material = "diffuse"
texture = "none"
reflect = 0.0
albedo = [0.5, 0.5, 0.5]

[const]
period = 'unit_size * 2'
v_count = 'floor((width + unit_size) / period)'
h_count = 'floor((height + unit_size) / period)'

# for i in range(v_count)
[[box]] # vertical beam
pos_x = 'i * period'
pos_y = 0.0
pos_z = 0.0
width = 'unit_size'
height = 'height'
depth = 'depth'
material = 'material'
albedo = 'albedo'
reflect = 'reflect'
texture = 'texture'
# endfor

# for j in range(h_count)
[[box]] # horizontal beam
pos_x = 0.0
pos_y = 'j * period'
pos_z = 0.0
width = 'width'
height = 'unit_size'
depth = 'depth'
material = 'material'
albedo = 'albedo'
reflect = 'reflect'
texture = 'texture'
# endfor
