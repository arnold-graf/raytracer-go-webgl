# Campfire — three wooden logs and a flickering warm light cluster.
#
# Origin (0,0,0) is the ground centre of the fire ring. Front faces -Z.
#
# Optional [[include]] props (defaults below):
#   brightness  overall light intensity multiplier  (default 10.0)
#   range       cull / falloff distance             (default 50.0)
#   flicker     intensity wobble in [0, 1]          (default 0.45)
#   speed       flicker speed multiplier            (default 1.0)
#   flame       ray-traced particle flame             (default false)
#   flame_ember flame HDR color at birth [r,g,b]      (default warm red)
#   flame_mid   flame HDR color mid-life              (default orange)
#   flame_tip   flame HDR color before fade           (default yellow)
#   flame_ash   flame HDR color at end of life        (default dim red-brown)
#
#   [[include]]
#   file = "objects/campfire.toml"
#   at = [8.0, 0.0, 58.0]
#   follow_terrain = true
#   props = { brightness = 1.0, range = 25.0, flicker = 0.45, speed = 1.0 }

[props]
brightness = 10.0
range = 50.0
flicker = 0.45
speed = 1.0
albedo = [0.34, 0.22, 0.14]
reflect = 0.01
flame_ember = [2.2, 0.32, 0.04]
flame_mid = [2.0, 0.85, 0.08]
flame_tip = [1.6, 1.2, 0.14]
flame_ash = [0.9, 0.32, 0.12]

[[light_flickering]]
center = [0.0, 0.5, 0.0]
color = [3.6, 1.7, 0.55]
brightness = 'brightness'
range = 'range'
jitter = 0.4
flicker = 'flicker'
speed = 'speed'
lights = 3
flame = true
flame_ember = 'flame_ember'
flame_mid = 'flame_mid'
flame_tip = 'flame_tip'
flame_ash = 'flame_ash'

