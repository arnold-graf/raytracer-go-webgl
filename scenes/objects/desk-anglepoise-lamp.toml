# Articulated chrome desk lamp (Anglepoise-style), in local coordinates.
#
# Origin (0, 0, 0) is the centre of the base on the desk surface. +Y is up;
# +Z points toward the user side of the desk. Place on a tabletop with
# at.y equal to the desk top height (e.g. 0.84 for simple-table height 0.9).
#
# Params (optional):
#   albedo       chrome body colour rgb           (default [0.6, 0.6, 0.6])
#   chrome_albedo  alias for albedo
#   reflect, chrome_rough  surface tuning
#   brightness   point-light intensity (default 0.08)
#   range        light reach in metres (default 4)

[props]
albedo = [0.6, 0.6, 0.6]
reflect = 0.1
chrome_rough = 0.1
brightness = 0.08
range = 4.0

# --- weighted base ---
[[cylinder]]
material = "diffuse"
albedo = 'albedo'
reflect = 'reflect'
rough = 'chrome_rough'
pos_x = -0.15
pos_y = 0.0
pos_z = -0.15
width = 0.3
height = 0.018
depth = 0.2

[[cylinder]]
material = "diffuse"
albedo = 'albedo'
reflect = 'reflect'
rough = 'chrome_rough'
pos_x = -0.055
pos_y = 0.018
pos_z = -0.055
width = 0.11
height = 0.022
depth = 0.11

[[cylinder]] # centre pivot post
material = "diffuse"
albedo = 'albedo'
reflect = 'reflect'
rough = 'chrome_rough'
pos_x = -0.04
pos_y = 0.04
pos_z = -0.04
width = 0.08
height = 0.03

# --- lower arm (twin rods, pivot → elbow, 20 mm diameter) ---
