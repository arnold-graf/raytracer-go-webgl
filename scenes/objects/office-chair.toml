# Chunky Eames-style office chair in local coordinates.
#
# Origin (0, 0, 0) is the centre of the base footprint on the floor.
# The sitter faces -Z (toward the desk in front).
#
#   [[include]]
#   file = "objects/office-chair.toml"
#   at = [0.0, 0.0, 0.0]
#   rotate_y = 180


# seat cushion
[props]
leather_albedo = [0.10, 0.10, 0.11]
chrome_albedo = [0.52, 0.52, 0.55]
reflect = 0.35
rough = 0.06

[const]
leg_len = 0.28
hub_y = 0.05
leg_w = 0.035
leg_r = 'leg_w / 2'
wheel = 0.07
wh = 'wheel / 2'

[[box]]
material = "diffuse"
albedo = 'leather_albedo'
reflect = 0.01
rough = 0.08
pos_x = -0.24
pos_y = 0.46
pos_z = -0.22
width = 0.48
height = 0.07
depth = 0.44

# backrest (tilted away from sitter)
[[box]]
material = "diffuse"
albedo = 'leather_albedo'
reflect = 0.01
rough = 0.08
rotate_x = 18
pos_x = -0.24
pos_y = 0.52
pos_z = 0.28
width = 0.48
height = 0.36
depth = 0.07

# seat mechanism block
[[box]]
material = "diffuse"
albedo = [0.05, 0.05, 0.06]
pos_x = -0.07
pos_y = 0.42
pos_z = -0.07
width = 0.14
height = 0.05
depth = 0.14

# gas lift column
[[cylinder]]
material = "metal"
albedo = 'chrome_albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = -0.03
pos_y = 0.08
pos_z = -0.03
width = 0.05
height = 0.34

# base hub
[[cylinder]]
material = "metal"
albedo = 'chrome_albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = -0.045
pos_y = 0.04
pos_z = -0.045
width = 0.09
height = 0.05

# five-star base legs (boxes from hub to each wheel)
[[box]]
material = "metal"
albedo = 'chrome_albedo'
reflect = 'reflect'
rough = 'rough'
transform_origin = [0, 'hub_y', 0]
pos_x = '-leg_r'
pos_y = 'hub_y - 0.015'
pos_z = 0.0
width = 'leg_w'
height = 0.03
depth = 'leg_len'

[[box]]
material = "metal"
albedo = 'chrome_albedo'
reflect = 'reflect'
rough = 'rough'
transform_origin = [0, 'hub_y', 0]
pos_x = '-leg_r'
pos_y = 'hub_y - 0.015'
pos_z = 0.0
width = 'leg_w'
height = 0.03
depth = 'leg_len'
rotate_y = 72

