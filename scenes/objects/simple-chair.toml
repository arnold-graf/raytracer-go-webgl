# Simple blocky wooden chair in local coordinates.
#
# Origin (0,0,0) is the centre of the footprint on the floor. Front faces -Z.
# Optional [[include]] params: albedo, reflect (defaults below).
#
#   [[include]]
#   file = "objects/simple-chair.toml"
#   at = [0.0, 0.0, 0.0]

{{$albedo := orVec3 .albedo 0.58 0.44 0.30}}
{{$reflect := or .reflect 0.01}}

[[box]] # leg (front right)
pos_x = 0.17
pos_y = 0.0
pos_z = 0.17
