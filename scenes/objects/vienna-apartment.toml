# Vienna Jugendstil apartment block — facade shell only, empty interior.
#
# Origin (0,0,0) is the centre of the front at grade; the building faces -Z
# (matching preview -view front). Exaggerated proportions: narrow (8 m),
# Ochre plaster with white stucco ornament; no floors, stairs, or furnishings.
#
#   y = 1.6    ground floor
#   y = 6.8    piano nobile (full-width balcony)
