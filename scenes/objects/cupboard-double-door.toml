# Floor-standing cupboard with double swinging doors and interior shelves.
#
# Local origin (0, 0, 0) is the front-left-bottom outer corner. The carcass
# extends +X (width), +Y (height), and +Z (depth, into the cupboard). Doors
# mount on the front face (z = 0) and swing outward toward -Z.
# open_sign = -1 because door panels extend in -Z from the hinge plane.
#
# Parameterized via [[include]] params (all optional):
#   width, height, depth   outer dimensions in metres (default 1.6, 2.2, 0.6)
#   shelves                count of interior shelves, evenly spaced (default 3)
#   door_gap               centre gap between closed door leaves in metres (default 0.005)
#   right_door_yaw         closed-pose yaw of the right leaf in degrees (default -2)
#   material, texture      surface material / texture name
#   albedo, reflect, rough surface overrides
#
#   [[include]]
#   file = "objects/cupboard-double-door.toml"
#   at = [12.0, 0.0, 18.8]
#   params = { width = 4.7, height = 3.0, depth = 1.0, shelves = 4, albedo = [0.01, 0.01, 0.01] }

[props]
width = 1.6
height = 2.2
depth = 0.6
shelves = 3
material = "diffuse"
texture = ""
albedo = [0.12, 0.11, 0.10]
reflect = 0.02
rough = 0.04
right_door_yaw = -2.0

[const]
side = 0.06
back = 0.06
top = 0.06
shelf_th = 0.04
inner_w = 'width - side * 2'
inner_d = 'depth - back'
shelf_w = 'inner_w'
shelf_d = 'inner_d - 0.04'
shelf_y0 = 0.18
shelf_y1 = 'height - top - 0.12'
shelf_span = 'shelf_y1 - shelf_y0'
shelf_step = 'shelf_span / (shelves + 1)'
hinge_right_x = 'width - side'

[[door]]
id = "cupboard_doors"
kind = "double"
hinge_left = ['side', 0.0, 0.0]
hinge_right = ['hinge_right_x', 0.0, 0.0]
axis = "y"
open_angle = 90
swing = "one_way"
open_sign = -1.0
speed = 1.8
panel_left_file = "cupboard-door-panel-left.toml"
panel_right_file = "cupboard-door-panel-right.toml"
panel_closed_angle = [0.0, 'right_door_yaw']
use_range = 2.0
hint = "DOOR"

[[box]] # left side
material = 'material'
# if texture
texture = 'texture'
# endif
albedo = 'albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = 0.0
pos_y = 0.0
pos_z = 0.0
width = 'side'
height = 'height'
depth = 'depth'

[[box]] # right side
material = 'material'
# if texture
texture = 'texture'
# endif
albedo = 'albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = 'width - side'
pos_y = 0.0
pos_z = 0.0
width = 'side'
height = 'height'
depth = 'depth'

[[box]] # back
material = 'material'
# if texture
texture = 'texture'
# endif
albedo = 'albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = 'side'
pos_y = 0.0
pos_z = 'depth - back'
width = 'inner_w'
height = 'height'
depth = 'back'

[[box]] # top
material = 'material'
# if texture
texture = 'texture'
# endif
albedo = 'albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = 0.0
pos_y = 'height - top'
pos_z = 0.0
width = 'width'
height = 'top'
depth = 'depth'

# for i in range(shelves)
# let n = i + 1
[[box]] # shelf
material = 'material'
# if texture
texture = 'texture'
# endif
albedo = 'albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = 'side'
pos_y = 'shelf_y0 + shelf_step * n'
pos_z = 0.02
width = 'shelf_w'
height = 'shelf_th'
depth = 'shelf_d'
# endfor
