# Left door leaf for cupboard-double-door.toml (same local coords / params).

[props]
width = 1.6
height = 2.2
material = "diffuse"
texture = ""
albedo = [0.12, 0.11, 0.10]
reflect = 0.02
rough = 0.04
door_gap = 0.005
chrome_albedo = [0.88, 0.89, 0.92]
chrome_reflect = 0.9
chrome_rough = 0.03

[const]
side = 0.06
door_th = 0.06
inner_w = 'width - side * 2'
door_w = '(inner_w - door_gap) / 2'
handle_y = 'height * 0.42'
handle_inset = 0.08
handle_x = 'side + door_w - handle_inset'

[[box]]
material = 'material'
# if texture
texture = 'texture'
# endif
albedo = 'albedo'
reflect = 'reflect'
rough = 'rough'
pos_x = 'side'
pos_y = 0.0
pos_z = '-door_th'
width = 'door_w'
height = 'height'
depth = 'door_th'

[[cylinder]]
material = "metal"
albedo = 'chrome_albedo'
reflect = 'chrome_reflect'
rough = 'chrome_rough'
pos_x = 'handle_x'
pos_y = 'handle_y'
pos_z = -0.07
width = 0.03
height = 0.1
rotate_x = 90

[[cylinder]]
material = "metal"
albedo = 'chrome_albedo'
reflect = 'chrome_reflect'
rough = 'chrome_rough'
pos_x = 'handle_x'
pos_y = 'handle_y'
pos_z = -0.1
width = 0.03
height = 0.3

[[cylinder]]
material = "metal"
albedo = 'chrome_albedo'
reflect = 'chrome_reflect'
rough = 'chrome_rough'
pos_x = 'handle_x'
pos_y = 'handle_y + 0.2'
pos_z = -0.07
width = 0.03
height = 0.1
rotate_x = 90
