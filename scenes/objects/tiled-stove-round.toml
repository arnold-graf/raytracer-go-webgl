# Round tiled stove (Kachelofen), in local coordinates.
# Origin (0,0,0) is the floor center; the stove stands in +Y, 2.5 m tall.
# Place in a parent scene with [[include]], sitting it on the floor, e.g.:
#
#   [[include]]
#   file = "objects/tiled-stove-round.toml"
#   at = [3.7, 0.4, -4.7]
#
# Approximation of a classical corner Kachelofen: wide plinth, stout firebox
# cylinder, stepped waist moldings, a tall upper shaft, a cornice belt, a domed
# cap and a small urn finial. All cream marble, slightly glossy.
#
# Profile (bottom → top):
#   plinth           y 0.00 – 0.10
#   firebox body     y 0.10 – 0.82
#   waist moldings   y 0.82 – 0.98   (two stepped rings)
#   upper shaft      y 0.98 – 2.00
#   cornice belt     y 2.00 – 2.14   (two stepped rings)
#   cap drum         y 2.14 – 2.22
#   dome             y 2.22 – 2.36
#   finial           y 2.36 – 2.50   (sphere + knob)

# Shared surface: warm cream marble, polished ceramic sheen.
# (repeat on every primitive below)

