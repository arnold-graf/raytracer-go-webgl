# Row of standing books with randomized heights and colours.
#
# Origin (0, 0, 0) is the centre of the cluster footprint on the shelf; books
# are placed along +X with their bottoms aligned at y = 0. Spines face -Z.
#
# Parameterized via [[include]] params (all optional):
#   width           shelf span occupied along X        (default 0.42)
#   min_height      shortest book spine height         (default 0.18)
#   max_height      tallest book spine height          (default 0.28)
#   min_thickness   narrowest book along X             (default 0.024)
#   max_thickness   thickest book along X              (default 0.034)
#   seed            randomization seed                 (default 1)
#   book_depth      spine-to-fore-edge depth           (default 0.18)
#   gap             space between neighbouring books   (default 0.004)
#
# Example on a bookshelf shelf:
#
#   [[include]]
#   file = "objects/book-cluster.toml"
#   at = [0.0, 0.88, 0.0]
#   params = { width = 0.5, min_height = 0.16, max_height = 0.26, seed = 42 }

[props]
width = 0.42
min_height = 0.18
max_height = 0.28
min_thickness = 0.024
max_thickness = 0.034
seed = 1
book_depth = 0.18
gap = 0.004

[const]
book_count = 'book_cluster_count(seed, width, gap, min_thickness, max_thickness)'

# for i in range(book_count)
# let h01 = hash01(seed, i)
# let book_h = min_height + h01 * (max_height - min_height)
# let book_t = book_thickness(seed, i, min_thickness, max_thickness)
# let cr = 0.20 + hash01(seed + 1.3, i + 2.1) * 0.65
# let cg = 0.16 + hash01(seed + 2.7, i + 5.3) * 0.65
# let cb = 0.12 + hash01(seed + 4.1, i + 8.7) * 0.65
# let bx = book_cluster_x(seed, i, width, gap, min_thickness, max_thickness)
[[include]]
file = "book.toml"
at = ['bx', 0, 0]
transform_origin = [0, 0, 0]
params = { height = 'book_h', thickness = 'book_t', depth = 'book_depth', albedo_r = 'cr', albedo_g = 'cg', albedo_b = 'cb' }
# endfor
