at = [3.7, 0.4, -4.7]
file = "tiled-stove-round.toml"
rotate_y = -45

# ------------------------------------------------- ceiling pendant lamps ----
# Two Otto-Wagner sphere lamps hang from the room ceiling and light the
# interior. Each include carries its own bronze stem, glass orb, filament
# emitter and warm point light (range-limited so it culls when you walk out).
# Nested includes compose with the building's own placement transform.

[[include]]
at = [-1.5, 6.2, 2]
file = "otto-wagner-sphere-lamp.toml"
params = { stem_len = 2.1, orb_radius = 0.5 }

[[include]]
at = [1.5, 5.7, 0.0]
file = "otto-wagner-sphere-lamp.toml"
params = { orb_radius = 0.5 }
