texture = "brick"

[[box]] # door lintel (brick) above the opening
albedo = [1.0, 1.0, 1.0]
material = "diffuse"
max = [1.5, 6.3, 5.9]
min = [-1.5, 3.0, 5.5]
texture = "brick"

# Tinted, rough glass pane filling the window opening (spans the wall thickness
# so it reads as glass from inside and outside).
[[box]]
albedo = [0.82, 0.90, 0.98]
ior = 1.45
material = "glass"
max = [-4.5, 3.5, 1.0]
min = [-4.9, 1.5, -1.0]
rough = 0.02
transmit = 0.85

