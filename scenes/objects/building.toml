# Stone building shell in local coordinates (origin = building center, y = floor).
# Place in a parent scene with [[include]] at = [16.0, 0.0, -2.0].
# Interior clear span: x in [-4.5, 4.5], z in [-5.5, 5.5], floor y = 0.4.

[[box]] # foundation / stone floor slab
material = "diffuse"
max = [4.9, 0.4, 5.9]
min = [-4.9, -0.3, -5.9]
# albedo = [1.0, 1.0, 1.0]
# texture = "marble"
# reflect = 0.05
# rough = 0.01
# for a wood texture
albedo = [0.25, 0.25, 0.25]
reflect = 0.01
rough = 0.01
texture = "wood"

[[box]] # slanted roof (cement); pitched toward the door (+z)
albedo = [1.0, 1.0, 1.0]
material = "diffuse"
max = [4.7, 6.1, 5.7]
min = [-4.7, 5.8, -5.7]
pivot = [0.0, 5.9, 0.0]
rotate_x = -12.0
texture = "cement"

[[box]] # north (back) wall: brick
albedo = [1.0, 1.0, 1.0]
material = "diffuse"
max = [4.9, 6.3, -5.5]
min = [-4.9, 0.0, -5.9]
texture = "brick"

[[box]] # west (left) wall: brick, with a window opening cut through it
albedo = [1.0, 1.0, 1.0]
material = "diffuse"
max = [-4.5, 6.3, 5.9]
min = [-4.9, 0.0, -5.9]
texture = "brick"
# Real see-through opening (CSG hole). X overshoots the wall thickness so it
# pierces both faces cleanly; the glass pane below fills it.
[[box.hole]]
max = [-4.4, 3.5, 1.0]
min = [-5.0, 1.5, -1.0]

[[box]] # east (right) wall: brick
albedo = [1.0, 1.0, 1.0]
material = "diffuse"
max = [4.9, 6.3, 5.9]
min = [4.5, 0.0, -5.9]
texture = "brick"

[[box]] # south wall, left of door: brick
albedo = [1.0, 1.0, 1.0]
