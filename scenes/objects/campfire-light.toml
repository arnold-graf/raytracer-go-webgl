# Warm point-light cluster with no visible geometry — pair with emissive
# embers/logs in the parent scene, or rely on the light alone at distance.
#
# Parameterized via [[include]] params (all optional; defaults below):
#   brightness  overall intensity multiplier   (default 10.0)
#   range       cull / falloff distance        (default 50.0)
#   flicker     intensity wobble in [0, 1]     (default 0.45)
#   speed       flicker speed multiplier       (default 1.0)
#
# Place with follow_terrain so at.y is an offset above ground:
#
#   [[include]]
#   file = "objects/campfire-light.toml"
#   at = [16.0, 0.5, 24.0]
#   follow_terrain = true
#   params = { brightness = 0.5, range = 50.0, flicker = 0.75, speed = 1.0 }

{{$brightness := or .brightness 10.0}}
{{$range := or .range 50.0}}
{{$flicker := or .flicker 0.45}}
{{$speed := or .speed 1.0}}

[[campfire]]
center = [0.0, 0.0, 0.0]
color = [3.6, 1.7, 0.55]
brightness = {{$brightness}}
range = {{$range}}
jitter = 0.4
flicker = {{$flicker}}
speed = {{$speed}}
