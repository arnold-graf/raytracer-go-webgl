# A single straight flight of stairs, in local coordinates.
#
# Origin (0,0,0) is the bottom-front corner. The flight ascends in +X. Each step
# is a solid block from the flight base up to that step's top (a filled
# staircase, not floating treads).
#
# Parameterized via [[include]] props (all optional):
#   steps  number of treads              (default 8)
#   run    horizontal depth per step     (default 0.5)
#   rise   vertical height per step     (default 0.375)
#   width  width in Z                   (default 1.6)
#
# With defaults the flight climbs 3.0 units over a 4.0 run (8 × 0.375 rise,
# 8 × 0.5 run). Override for taller/shorter flights, e.g.:
#
#   props = { steps = 12, run = 0.45, rise = 0.25, width = 1.8 }
#
# Place it with [[include]] and an instance transform. The include's rotate_y
# turns the whole flight about the object file's origin (bottom-front corner), so
# rotate_y = 180 flips the flight to ascend in -X (Manhattan switchbacks):
#
#   [[include]]                 # up-and-to-the-right flight
#   file = "objects/staircase.toml"
#   at = [-4.0, 0.0, -6.0]
#
#   [[include]]                 # next flight, turned 180 deg into the back lane
#   file = "objects/staircase.toml"
#   at = [0.0, 3.0, -2.6]
#   rotate_y = 180.0
#
# Transformed boxes render on both the CPU and GPU and report correct world
# bounds, so the steps stay walkable after rotation (a 180-degree turn keeps
# them axis-aligned).

[props]
steps = 8
run = 0.5
rise = 0.375
width = 1.6
texture = "cement"
rough = 0.0
albedo = [0.5, 0.49, 0.47]
reflect = 0.0
handrail_left = false
handrail_right = false

# for i in range(steps)
[[box]] # step
pos_x = 'i * run'
pos_y = '(i + 1) * rise'
pos_z = 0.0
width = 'run * 2'
height = 'rise'
depth = 'width'
material = "diffuse"
albedo = 'albedo'
reflect = 'reflect'
texture = 'texture'
rough = 'rough'
# endfor

# if handrail_left
[[include]]
file = "staircase-handrail.toml"
at = [0,0,0]
transform_origin = [0,0,0]
props = { steps = 'steps', run = 'run', rise = 'rise', albedo = 'albedo', reflect = 'reflect', texture = 'texture' }
# endif

# if handrail_right
[[include]]
file = "staircase-handrail.toml"
at = [0,0,'width - 0.2']
transform_origin = [0,0,0]
props = { steps = 'steps', run = 'run', rise = 'rise', albedo = 'albedo', reflect = 'reflect', texture = 'texture' }
# endif
