# Art-Nouveau villa (approximation), in local coordinates.
#
# Origin (0,0,0) is the centre of the front at grade; the house faces +Z.
# Symmetrical layout: projecting side wings, a recessed central block, and a
# ground-floor bay window.  Stone plinth (~1.2 m), two 4.5 m storeys, plain
# interior with a stair to the upper floor and an open fireplace.
#
#   y = 1.2   ground floor
#   y = 5.7   second floor   (4.5 m floor-to-floor)
#   y = 10.2  eaves / roof base
#
# Place with [[include]], e.g.:
#
#   [[include]]
#   file = "objects/art-nouveau-villa.toml"
#   at = [0.0, 0.0, -10.0]
#
# Plaster ~ cream, stone base, dark tile roofs, dark wood window frames.

# Flatten the ground under the house. The stub [[terrain]] only exists so the
# [[terrain.pad]] below decodes; an object never carries its own height field,
# so the pad is merged into whatever terrain the parent scene defines. The pad
# is in this object's local coordinates and is moved by the include's `at`.
[[terrain]]

[[terrain.pad]] # flat site under the villa (footprint ~15 × 13 m + margin)
center = [0.0, 0.0]
half = [8.5, 8.0]
level = 0.0
margin = 5.0

# ============================================================ STONE PLINTH ====

[[box]] # rough stone base (full footprint incl. bay)
albedo = [0.58, 0.54, 0.48]
material = "diffuse"
max = [7.6, 1.2, 7.8]
min = [-7.6, 0.0, -5.6]
texture = "stone"

# ===================================================== GROUND FLOOR SLAB ====

[[box]] # interior ground floor (stone flags)
albedo = [0.72, 0.70, 0.66]
material = "diffuse"
max = [7.0, 1.28, 6.8]
min = [-7.0, 1.2, -5.2]
texture = "marble"
reflect = 0.03
rough = 0.02

