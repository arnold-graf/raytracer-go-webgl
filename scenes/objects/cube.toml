# The Cube is a 5x5x0.5 room. Origin is the footprint center. Interior walls
# display the five captured views (forward, left, right, up, down).
#
# Exit portal arrival uses [[point]] id "cube_lab_1" (see internal/app/portal.go).
# floor_y is the walkable surface; pos is x/z in the room. Do not SnapToGround on
# arrival — Manhattan's center tower roof sits above this point.

[[point]]
id = "cube_lab_1"
pos = [1.5, 0.0, 1.5]
floor_y = 0.3
yaw = 0.0
pitch = 0.0

[[sphere]]
cut_off = 0.45
material = "glass"
center = [1.7, 1.8, 1.5]
radius = 0.2
albedo = [0.3, 0.3, 0.3]
reflect = 0.5
rough = 0.0

[[sphere]]
material = "metal"
center = [1.7, 2, 1.5]
radius = 0.05
albedo = [0.3, 0.3, 0.3]
reflect = 0.5
rough = 0.0

[[cylinder]]
material = "metal"
pos_x = 1.45
pos_y = 1.95
pos_z = 1.47
width = 0.05
height = 0.7
rotate_z = 40
depth = 0.3
albedo = [0.3, 0.3, 0.3]
reflect = 0.2
rough = 0.01

[[sphere]]
material = "metal"
center = [1.25, 2.6, 1.5]
radius = 0.05
albedo = [0.3, 0.3, 0.3]
reflect = 0.5
rough = 0.0

[[cylinder]]
material = "metal"
pos_x = 1.45
pos_y = 2.5
pos_z = 1.47
width = 0.05
height = 0.7
rotate_z = -40
depth = 0.3
albedo = [0.3, 0.3, 0.3]
reflect = 0.2
rough = 0.01

[[sphere]]
material = "metal"
center = [1.72, 3.15, 1.5]
radius = 0.05
albedo = [0.3, 0.3, 0.3]
reflect = 0.5
rough = 0.0

[[cylinder]]
material = "metal"
pos_x = 1.7
pos_y = 3.15
pos_z = 1.47
width = 0.05
height = 0.9
depth = 0.3
albedo = [0.3, 0.3, 0.3]
reflect = 0.2
rough = 0.01

[[sphere]]
material = "metal"
center = [1.72, 4.01, 1.5]
radius = 0.1
albedo = [0.3, 0.3, 0.3]
reflect = 0.5
rough = 0.0

# Front wall (interior face +Z)
[[box]]
material = "diffuse"
pos_x = -1
pos_y = -1
pos_z = -1
width = 5
height = 5
depth = 0.5
albedo = [0.01, 0.01, 0.01]
texture_front = "capture_forward"

# Light
[[light_flickering]]
center = [1.7, 1, 1]
color = [0.1, 0.1, 0.2]
brightness = 5
range = 50
flicker = 0.5
speed = 0.5
seed = 0
lights = 3

# Left wall (interior face +X)
[[box]]
material = "diffuse"
pos_x = -1
pos_y = -1
pos_z = -1
width = 0.5
height = 5
depth = 5
albedo = [0.01, 0.01, 0.01]
texture_right = "capture_left"

# Left wall metal cover
[[box]]
material = "diffuse"
pos_x = -1.1
pos_y = -1
pos_z = -1
width = 0.1
height = 5.5
depth = 5
rough = 0.01
albedo = [0.1, 0.1, 0.1]

# Right wall (interior face -X)
[[box]]
material = "diffuse"
pos_x = 4
pos_y = -1
pos_z = -1
width = 0.5
height = 5.5
depth = 5
albedo = [0.01, 0.01, 0.01]
texture_left = "capture_right"

# Right wall metal cover
[[box]]
material = "diffuse"
pos_x = 4.5
pos_y = -1
pos_z = -1
width = 0.1
height = 5.5
depth = 5
rough = 0.01
albedo = [0.1, 0.1, 0.1]

# Roof (interior face -Y)
[[box]]
material = "diffuse"
pos_x = -1
pos_y = 4
pos_z = -1
width = 5.5
height = 0.5
depth = 5
albedo = [0.01, 0.01, 0.01]
texture_bottom = "capture_up"

# Roof metal cover
[[box]]
material = "diffuse"
pos_x = -1.1
pos_y = 4.5
pos_z = -1
width = 5.7
height = 0.1
depth = 5
rough = 0.01
albedo = [0.1, 0.1, 0.1]

# Pipes from the cube to the ceiling
[[cylinder]]
material = "diffuse"
reflect = 0.2
rough = 0.01
albedo = [1, 0, 0]
pos_x = 1.4
pos_y = 5
pos_z = 3
width = 0.2
height = 2

[[cylinder]]
material = "diffuse"
reflect = 0.2
rough = 0.01
albedo = [0, 1, 0]
pos_x = 0.7
pos_y = 5
pos_z = 3
width = 0.2
height = 2

[[cylinder]]
material = "diffuse"
reflect = 0.2
rough = 0.01
albedo = [1, 1, 0]
pos_x = 2
pos_y = 5
pos_z = 3
width = 0.2
height = 2

# Floor (interior face +Y)
[[box]]
material = "diffuse"
pos_x = -1
pos_y = 0
pos_z = -1
width = 5
height = 0.25
depth = 5
albedo = [0.01, 0.01, 0.01]
texture_top = "capture_down"

# Back opening — sliding panel (closed covers -Z side; opens downward)
[[door]]
id = "cube_lift"
kind = "sliding"
can_close = false
direction = "down"
open_distance = 5.0
speed = 1.2
panel_file = "cube-door-panel.toml"
use_range = 2.5
hint = "DOOR"
