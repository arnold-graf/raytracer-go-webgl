# Manhattan-style city block: three concrete skyscrapers in a row on a flat
# lot, each with ribbon windows (real see-through CSG openings filled with
# tinted glass) and an open interior you can walk into through a ground-floor
# doorway -- columns plus a switchback concrete staircase climbing to the roof.
# Pine trees line the street. Lit by a low, warm sunset sun.
#
# Generated by /tmp/gen_manhattan.py (kept here as a static, editable scene).
#
# Run with:
#   go run . -scene scenes/manhattan_city_block.toml
#   go run ./cmd/preview -scene scenes/manhattan_city_block.toml -o preview_manhattan.png

# ---------------------------------------------------------------- camera ----
# Stand in the street, facing the towers (yaw 0 looks toward -Z), tilted up a
# little to take in the height. Walk forward (W) to enter the center building.

[camera]
pitch = 0.16
pos = [0.0, 1.7, 28.0]
yaw = 0.0

# ----------------------------------------------------------- environment ----
# Low warm sun raking the facades; soft dusk ambient.

[environment]
ambient_ground = [0.16, 0.12, 0.11]
ambient_sky = [0.46, 0.30, 0.34]
sky = "sunset"
sun_color = [1.50, 0.62, 0.26]
sun_dir = [-0.32, -0.20, 0.92]

# --------------------------------------------------------------- terrain ----
# Flat concrete lot (no relief features): a single cement plane the towers and
# trees sit on.

[[terrain]]
base = 0.0
detail = 0.0
detail_scale = 0.1
grass = "cement"
origin = [-70.0, 0.0, -70.0]
rock = "stone"
size = [140.0, 140.0]
slope_hi = 0.95
slope_lo = 0.7
snow = "snow"
snow_hi = 1000.0
snow_lo = 999.0
step = 0.0

