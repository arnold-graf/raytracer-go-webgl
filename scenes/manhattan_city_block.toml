# ================================= CENTER TOWER STAIRCASE (walkable) ====
# A switchback built from one reusable flight (objects/staircase.toml) placed
# 11 times. at.y is an offset above the terrain at (at.x, at.z) — on this flat
# lot that equals the absolute height (0, 3, 6, …). Even flights climb +X in
# the front lane (z -6.0..-4.4); odd flights are turned 180 deg (rotate_y) into
# the back lane (z -4.2..-2.6). A landing slab bridges the two lanes at the
# top of each flight so you can turn and keep climbing to the roof (y = 33).
# Edit the flight once and every step updates.

[[include]] # flight 0  (front lane, +X)
file = "objects/staircase.toml"
at = [-4.0, 0.0, -6.0]

[[box]] # landing 0
min = [0.0, 2.6, -6.0]
max = [1.6, 3.0, -2.6]
material = "diffuse"
albedo = [0.5, 0.49, 0.47]
texture = "cement"

[[include]] # flight 1  (back lane, turned 180 deg)
