# Preview template — copy to scenes/preview/<object-name>.toml and replace the
# [[include]] path.  Use bright, even lighting so agents can verify geometry;
# do NOT verify facade detail in night-map scenes.
#
#   cp scenes/preview/_template.toml scenes/preview/my-object.toml
#   # edit the [[include]] file path, then:
#   go run ./cmd/preview -scene scenes/preview/my-object.toml -zoom 1.5 -w 1024 -h 640 -o tmp/my-object
#   go run ./cmd/preview -scene scenes/preview/my-object.toml -view front -zoom 1.8 -w 1024 -h 640 -views 1 -o tmp/my-object-front

[environment]
sky = "clear"
ambient_sky = [0.35, 0.38, 0.45]
ambient_ground = [0.12, 0.11, 0.10]
sun_dir = [-0.35, -0.85, -0.38]
sun_color = [1.0, 0.95, 0.88]

# Key + fill — single side light silhouettes half the subject.
[[light]]
pos = [10.0, 14.0, 12.0]
color = [1.0, 0.98, 0.92]
brightness = 25.0
range = 0

[[light]]
pos = [-8.0, 8.0, 10.0]
color = [0.85, 0.88, 1.0]
brightness = 12.0
range = 0

[[plane]]
normal = [0.0, 1.0, 0.0]
d = 0.0
material = "diffuse"
texture = "stone_wall"
albedo = [0.65, 0.63, 0.58]
reflect = 0.04
rough = 0.15

[[include]]
file = "../objects/REPLACE-ME.toml"
at = [0.0, 0.0, 0.0]
