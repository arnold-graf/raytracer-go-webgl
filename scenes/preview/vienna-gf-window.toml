# Single GF window module — isolated verification.
#
#   go run ./cmd/preview -scene scenes/preview/vienna-gf-window.toml -view front -zoom 2.5 -w 1024 -h 640 -views 1 -o tmp/gf-window

[environment]
sky = "clear"
ambient_sky = [0.35, 0.38, 0.45]
ambient_ground = [0.12, 0.11, 0.10]
sun_dir = [-0.35, -0.85, -0.38]
sun_color = [1.0, 0.95, 0.88]

[[light]]
pos = [4.0, 6.0, 5.0]
color = [1.0, 0.98, 0.92]
brightness = 25.0
range = 0

[[plane]]
normal = [0.0, 1.0, 0.0]
d = 0.0
material = "diffuse"
texture = "stone_wall"
albedo = [0.65, 0.63, 0.58]

[[include]]
file = "../objects/vienna-gf-window.toml"
at = [-0.6, 1.6, -0.1]
[include.props]
width = 1.1
height = 3.6
module_width = 1.2
