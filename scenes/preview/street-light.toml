# Street lamp on a simple floor — check soft shadow under the post.
# go run ./cmd/preview -scene scenes/preview/street-light.toml -view front -zoom 1.5 -views 1 -o tmp/street-light

[camera]
pos = [0.0, 1.2, 5.0]
yaw = 180.0
pitch = -5.0

[environment]
sky = "night_stars"
ambient_ground = [0.02, 0.02, 0.03]
ambient_sky = [0.04, 0.05, 0.08]

[[plane]]
normal = [0.0, 1.0, 0.0]
d = 0.0
material = "diffuse"
texture = "stone_wall"
albedo = [0.7, 0.68, 0.62]
reflect = 0.04
rough = 0.15

[[include]]
file = "../objects/art-deco-street-light.toml"
at = [0.0, 0.0, 0.0]
