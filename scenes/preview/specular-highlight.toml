# Blinn–Phong specular highlights on diffuse surfaces.
# go run ./cmd/preview -scene scenes/preview/specular-highlight.toml -view front -zoom 1.5 -views 1 -o tmp/specular

[camera]
pos = [0.0, 2.2, 5.5]
yaw = 180.0
pitch = -12.0

[[plane]]
normal = [0.0, 1.0, 0.0]
d = 0.0
material = "diffuse"
albedo = [0.14, 0.14, 0.17]
reflect = 0.08
rough = 0.04

[[sphere]]
center = [0.0, 0.55, 0.0]
radius = 0.55
material = "diffuse"
albedo = [0.82, 0.18, 0.22]
specular = 0.95
shininess = 128

[[sphere]]
center = [-1.25, 0.38, 0.35]
radius = 0.38
material = "diffuse"
albedo = [0.18, 0.55, 0.88]
specular = 0.65
shininess = 48

[[sphere]]
center = [1.25, 0.38, 0.35]
radius = 0.38
material = "diffuse"
albedo = [0.88, 0.82, 0.22]
specular = 0.35
shininess = 16

[[box]]
pos_x = 0.0
pos_y = 0.0
pos_z = -1.2
width = 2.4
height = 0.06
depth = 0.4
material = "diffuse"
albedo = [0.22, 0.22, 0.25]
specular = 0.5
shininess = 64

[[light]]
pos = [1.8, 3.8, 2.2]
color = [3.2, 2.8, 2.4]
radius = 0.55

[[light]]
pos = [-2.5, 2.8, -1.0]
