# Preview: compound desk + dynamic crate on a floor slab.

[[box]]
material = "diffuse"
pos_x = 0
pos_y = -0.05
pos_z = 0
width = 8
height = 0.1
depth = 8
albedo = [0.35, 0.35, 0.38]

[[include]]
file = "../objects/physics-desk.toml"
at = [0, 0, 0]

[[include]]
file = "../objects/physics-crate.toml"
at = [0.8, 0.76, 0.2]

[environment]
sky = "clear"
ambient_sky = [0.4, 0.42, 0.48]
