# Taplo CLI configuration (taplo check). IDE uses tombi.toml — see schemas/README.md.

[[rule]]
include = ["scenes/*.toml", "scenes/**/*.toml"]

[rule.schema]
path = "schemas/scene.schema.json"
enabled = true

[[rule]]
include = ["player.toml"]

[rule.schema]
path = "schemas/player.schema.json"
enabled = true
